name: Build AFTERSIGNAL for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "half-life 3 -3d-web/half-life-3-web-3d/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: half-life 3 -3d-web/half-life-3-web-3d
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate game JavaScript syntax
        run: node --check src/game.js
      - name: Build AFTERSIGNAL installer and portable EXE
        run: npm run dist:win
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: AFTERSIGNAL-Windows
          path: |
            half-life 3 -3d-web/half-life-3-web-3d/dist/*.exe
          if-no-files-found: error
          retention-days: 30
