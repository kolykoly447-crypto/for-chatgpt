name: Build Roblox Place Reader Windows EXE

on:
  push:
    branches:
      - build/roblox-place-reader-exe-20261115

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name RobloxPlaceReader RobloxPlaceReader/app.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPlaceReader-Windows
          path: dist/RobloxPlaceReader.exe
          if-no-files-found: error
          retention-days: 30
