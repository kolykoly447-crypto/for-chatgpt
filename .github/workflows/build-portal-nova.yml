name: Build Portal Nova for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "PortalNova/**"
      - ".github/workflows/build-portal-nova.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Export Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        shell: pwsh
        run: |
          $godotExe = (Get-Command godot).Source
          Write-Host "Godot executable: $godotExe"
          $version = Start-Process -FilePath $godotExe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($version.ExitCode -ne 0) { throw "Godot version check failed with exit code $($version.ExitCode)" }

      - name: Import project resources
        shell: pwsh
        run: |
          $godotExe = (Get-Command godot).Source
          $import = Start-Process -FilePath $godotExe -ArgumentList '--headless --editor --path "PortalNova" --quit' -Wait -PassThru -NoNewWindow
          if ($import.ExitCode -ne 0) { throw "Godot import failed with exit code $($import.ExitCode)" }

      - name: Export Windows executable
        shell: pwsh
        run: |
          $godotExe = (Get-Command godot).Source
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "PortalNova\build"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          $exePath = Join-Path $buildDir "PortalNova.exe"
          $arguments = '--headless --path "PortalNova" --export-release "Windows Desktop" "' + $exePath + '"'
          $export = Start-Process -FilePath $godotExe -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($export.ExitCode -ne 0) { throw "Godot export failed with exit code $($export.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exePath)) {
            Write-Host "Generated files:"
            Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "PortalNova") -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Godot finished without creating PortalNova.exe at $exePath"
          }
          Get-Item -LiteralPath $exePath | Format-List FullName,Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PortalNova-Windows-x86_64
          path: PortalNova/build/PortalNova.exe
          if-no-files-found: error
          retention-days: 14
